<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перельман 2</title>
  <link rel="stylesheet" href="pic.css">
</head>
<body>
  <!-- часть Content-->
  <main class="content">
    <h1 class="content__title">Перельман Георгий, 5130903/40303, вариант 2</h1>
    <!-- сам рисунок: чайник на столе у картины -->
    <div class="drawing drawing--variant-2" role="img" aria-label="Чайник на столе">
      <!-- стена -->
      <div class="drawing__wall wall">
        <!-- картина в рамке -->
        <div class="wall__picture picture">
          <div class="picture__lace"></div>
          <div class="picture__frame"></div>
          <div class="picture__canvas">
            <div class="canvas__sun"></div>
            <div class="canvas__teapot teapot">
              <div class="teapot__spout"></div>
              <div class="teapot__handle"></div>
              <div class="teapot__knob"></div>
              <div class="teapot__lid"></div>
              <div class="teapot__body"></div>
            </div>
          </div>
        </div>

        <!-- стол -->
        <div class="wall__table table">
          <div class="table__top"></div>
          <div class="table__leg"></div>
        </div>

        <!-- стул слева -->
        <div class="wall__chair chair chair--left">
          <div class="chair__back"></div>
          <div class="chair__seat"></div>
          <div class="chair__leg"></div>
        </div>

        <!-- стул справа -->
        <div class="wall__chair chair chair--right">
          <div class="chair__back"></div>
          <div class="chair__seat"></div>
          <div class="chair__leg"></div>
        </div>
      </div><!-- /.wall -->
    </div><!-- /.drawing -->
  </main>
</body>
</html>
